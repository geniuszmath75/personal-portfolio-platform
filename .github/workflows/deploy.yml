name: Deploy

# Trigger: pushing a version tag builds + publishes the image and deploys it
# to the VPS. `workflow_dispatch` lets you re-run a deploy for an existing
# tag (e.g. after fixing GHCR package visibility) without cutting a new one.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Avoid two deploys of the same tag racing each other; never cancel a deploy
# that's already in progress.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NUXT_PUBLIC_SITE_URL / UPLOAD_PUBLIC_BASE_URL are public-facing
      # values baked into the client bundle at build time —
      # set them once as repository *variables*.
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL }}
            UPLOAD_PUBLIC_BASE_URL=${{ vars.UPLOAD_PUBLIC_BASE_URL }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    # Gates VPS secrets behind the "production" GitHub Environment.
    environment: production
    steps:
      # Pulls the image tag that was just pushed and restarts the app via
      # docker-compose.prod.yml.
      - name: Pull & restart on the VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: IMAGE_TAG
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

      # Fast fail-safe, not a substitute for the full go-live verification.
      - name: Smoke test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            curl -fsS --max-time 10 "http://127.0.0.1:${APP_PORT:-3000}/api/v1/health"

# Local / Docker development stack: Nuxt app + MongoDB (+ optional seed profile).

services:
  mongo:
    image: mongo:8.0.28
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-}
        UPLOAD_PUBLIC_BASE_URL: ${UPLOAD_PUBLIC_BASE_URL:-}
    image: personal-portfolio-platform:dev
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env.development
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      # Compose network Mongo (overrides any host URI from env_file)
      NUXT_MONGO_DB_URI: mongodb://mongo:27017/personal-portfolio
      NUXT_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.development}
      NUXT_JWT_LIFETIME: ${JWT_LIFETIME:-1200}
      NUXT_UPLOAD_DRIVER: ${UPLOAD_DRIVER:-local}
      NUXT_S3_ENDPOINT: ${S3_ENDPOINT:-}
      NUXT_S3_REGION: ${S3_REGION:-}
      NUXT_S3_BUCKET: ${S3_BUCKET:-}
      NUXT_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      NUXT_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      NUXT_PUBLIC_ENVIRONMENT: ${ENV:-development}
      NUXT_PUBLIC_BASE_API_PATH: ${BASE_API_PATH:-/api/v1}
      NUXT_PUBLIC_UPLOAD_PUBLIC_BASE_URL: ${UPLOAD_PUBLIC_BASE_URL:-}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-}
    volumes:
      - uploads_data:/app/.output/public/uploads
    depends_on:
      mongo:
        condition: service_healthy

  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    working_dir: /app
    env_file:
      - .env.development
    environment:
      MONGODB_URI: mongodb://mongo:27017/personal-portfolio
      NUXT_MONGO_DB_URI: mongodb://mongo:27017/personal-portfolio
      NUXT_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.development}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_RESET_ADMIN: ${SEED_RESET_ADMIN:-false}
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command: ["npm", "run", "seed"]

volumes:
  mongo_data:
  uploads_data:
